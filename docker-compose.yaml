services:
  proxmox-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: yansyrod/proxmox-mcp-server:local
    container_name: proxmox-mcp-server
    restart: unless-stopped
    env_file:
      - .env
    stdin_open: true
    tty: true

    # Enable this read-only mount only when guest SSH operations are used.
    # Create ./ssh/id_ed25519 and ./ssh/known_hosts first and restrict permissions.
    # volumes:
    #   - ./ssh:/run/proxmox-mcp-ssh:ro

    healthcheck:
      test: ["CMD", "python", "-c", "import proxmox_mcp, asyncssh, httpx; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    labels:
      - "com.yansyrod.mcp-server=proxmox"
      - "com.yansyrod.version=2.1.0"
